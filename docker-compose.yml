services:
  postgres:
    image: postgres:16-alpine
    container_name: rankly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rankly
      POSTGRES_PASSWORD: rankly_dev_password
      POSTGRES_DB: rankly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rankly"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
