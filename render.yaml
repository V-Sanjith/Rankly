services:
  - type: web
    name: rankly-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: rankly-db
          property: connectionString
      - key: CLIENT_URL
        value: https://rankly.vercel.app
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: rankly-db
    plan: free
    databaseName: rankly
    user: rankly
