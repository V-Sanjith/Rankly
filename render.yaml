services:
  - type: web
    name: rankly-vsanjith-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rankly-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: rankly-db
          property: connectionString
      - key: CLIENT_URL
        value: https://rankly-vsanjith.onrender.com
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: rankly-vsanjith
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://rankly-vsanjith-api.onrender.com/api/:splat
      - type: rewrite
        source: /health
        destination: https://rankly-vsanjith-api.onrender.com/health
      - type: rewrite
        source: /socket.io/*
        destination: https://rankly-vsanjith-api.onrender.com/socket.io/:splat
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: rankly-db
    plan: free
    databaseName: rankly
    user: rankly
