services:
  - type: web
    name: rankly-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rankly-db
          property: connectionString
      - key: CLIENT_URL
        value: https://rankly.vercel.app
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: rankly-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rankly-api
          property: host

databases:
  - name: rankly-db
    plan: free
    databaseName: rankly
    user: rankly
